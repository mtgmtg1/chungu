# [Flow: Step 1 (redis 기동) -> Step 2 (api: FastAPI + Supabase 연동) -> Step 3 (worker: Celery + Storage) -> Step 4 (volume에 임시 작업 저장)]
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_WORKER_URL: ${VITE_TURNSTILE_WORKER_URL:-}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 28181
    env_file: .env
    environment:
      # Docker 네트워크 내부에서 ai-backend 컨테이너로 프록시
      - AI_BACKEND_URL=http://ai-backend:3001
    ports:
      - "${APP_PORT:-28181}:28181"
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
      ai-backend:
        condition: service_started
    networks:
      - default
      - supabase-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_WORKER_URL: ${VITE_TURNSTILE_WORKER_URL:-}
    command: celery -A backend.celery_app.celery worker --loglevel=info --concurrency=16
    env_file: .env
    environment:
      - DOCLING_SERVICE_URL=http://docling:28182
      - PADDLEOCR_SERVICE_URL=http://paddleocr_service:8080
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
      docling:
        condition: service_started
      paddleocr_service:
        condition: service_started
    networks:
      - default
      - supabase-network
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_WORKER_URL: ${VITE_TURNSTILE_WORKER_URL:-}
    command: celery -A backend.celery_app.celery beat --loglevel=info
    env_file: .env
    environment:
      - DOCLING_SERVICE_URL=http://docling:28182
      - PADDLEOCR_SERVICE_URL=http://paddleocr_service:8080
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - supabase-network
    restart: unless-stopped

  docling:
    build:
      context: .
      dockerfile: backend/docling_service/Dockerfile
    env_file: .env
    ports:
      - "${DOCLING_SERVICE_PORT:-28182}:28182"
    volumes:
      - appdata:/data
      - docling_models:/app/models
    networks:
      - default
    restart: unless-stopped

  paddleocr_service:
    build:
      context: .
      dockerfile: backend/paddleocr_service/Dockerfile
    env_file: .env
    environment:
      - PADDLEOCR_API_TOKEN=${PADDLEOCR_API_TOKEN:-}
      - PADDLEOCR_API_URL=${PADDLEOCR_API_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
    volumes:
      - appdata:/data
    networks:
      - default
    restart: unless-stopped

  # [Flow: FastAPI api 서비스가 /api/ai/* 요청을 이 컨테이너(3001)로 리버스 프록시한다]
  # Vercel AI SDK 5.x 기반 Node.js AI 백엔드. streamText + tools로 에이전트 도구 루프를 처리.
  ai-backend:
    build:
      context: .
      dockerfile: ai-backend/Dockerfile
    env_file: .env
    environment:
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://192.168.1.69:18080/v1}
      - LLM_MODEL=${LLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # FastAPI에 도구 호출을 전달할 때 사용할 base URL (컨테이너 내부에서 api 서비스로)
      # 런타임에 도구 호출 시 api를 찾으므로 startup 의존성은 없음 (순환 의존 방지)
      - PROOF_API_URL=http://api:28181
    networks:
      - default
    restart: unless-stopped

volumes:
  appdata:
  docling_models:

networks:
  supabase-network:
    external: true
    name: supabase-network
