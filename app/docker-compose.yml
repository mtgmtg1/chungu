# [Flow: Step 1 (redis 기동) -> Step 2 (api: FastAPI + Supabase 연동) -> Step 3 (worker: Celery + Storage) -> Step 4 (volume에 임시 작업 저장)]
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_WORKER_URL: ${VITE_TURNSTILE_WORKER_URL:-}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 28181
    env_file: .env
    environment:
      # Docker 네트워크 내부에서 ai-backend 컨테이너로 프록시
      - AI_BACKEND_URL=http://ai-backend:3001
      # Kata Containers 샌드박스 (에이전트 격리 실행 환경)
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-false}
      - SANDBOX_DATA_DIR=${SANDBOX_DATA_DIR:-/data/jobs}
      - SANDBOX_RUNTIME=${SANDBOX_RUNTIME:-io.containerd.kata-clh.v2}
      - SANDBOX_RUNTIME_DENSE=${SANDBOX_RUNTIME_DENSE:-io.containerd.kata-clh-dense.v2}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-proof-agent:latest}
      - SANDBOX_BROWSERLESS_URL=${SANDBOX_BROWSERLESS_URL:-http://192.168.1.50:20047}
      # Unoserver (LibreOffice listener) - PPTX/DOCX/HWP PDF 미리보기 변환
      - UNOSERVER_ENABLED=${UNOSERVER_ENABLED:-true}
      - UNOSERVER_HOST=${UNOSERVER_HOST:-unoserver}
      - UNOSERVER_PORT=${UNOSERVER_PORT:-2003}
      # OCR 서비스 주소 (worker/beat와 동일 — .env의 값이 컨테이너 외부를 가리키지 않도록 고정)
      - DOCLING_SERVICE_URL=http://docling:28182
      - PADDLEOCR_SERVICE_URL=http://paddleocr_service:8080
    ports:
      - "${APP_PORT:-28181}:28181"
    # privileged: 호스트 containerd socket 에 접근하여 Kata VM 을 생성/관리하려면 필요.
    # nerdctl 이 containerd shim 을 실행하고 Kata VM 프로세스를 제어해야 함.
    privileged: true
    volumes:
      # appdata volume 의 호스트 경로를 직접 마운트 — nerdctl 이 호스트 경로 기준으로
      # Kata VM 에 bind mount 하므로 컨테이너 내부 /data 가 호스트 /data 와 동일해야 함.
      - /var/lib/docker/volumes/chungu-app_appdata/_data:/data
      # Kata Containers 샌드박스: 호스트 containerd socket + FIFO 공유
      # /run/containerd 전체를 마운트 — nerdctl exec 가 FIFO 파일을 생성/접근하려면
      # 호스트와 컨테이너가 동일한 /run/containerd/fifo/ 경로를 공유해야 함.
      - /run/containerd:/run/containerd
      - /opt/kata:/opt/kata:ro
      - /etc/kata-containers:/etc/kata-containers:ro
      - /usr/local/bin/containerd-shim-kata-clh-v2:/usr/local/bin/containerd-shim-kata-clh-v2:ro
      - /usr/local/bin/containerd-shim-kata-clh-dense-v2:/usr/local/bin/containerd-shim-kata-clh-dense-v2:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /opt/cni/bin:/opt/cni/bin:ro
      - /var/lib/nerdctl:/var/lib/nerdctl
    depends_on:
      redis:
        condition: service_healthy
      ai-backend:
        condition: service_started
      unoserver:
        condition: service_healthy
    networks:
      - default
      - supabase-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_WORKER_URL: ${VITE_TURNSTILE_WORKER_URL:-}
    command: celery -A backend.celery_app.celery worker --loglevel=info --concurrency=16
    env_file: .env
    environment:
      - DOCLING_SERVICE_URL=http://docling:28182
      - PADDLEOCR_SERVICE_URL=http://paddleocr_service:8080
      # Unoserver (LibreOffice listener) - PPTX/DOCX/HWP PDF 미리보기 변환
      - UNOSERVER_ENABLED=${UNOSERVER_ENABLED:-true}
      - UNOSERVER_HOST=${UNOSERVER_HOST:-unoserver}
      - UNOSERVER_PORT=${UNOSERVER_PORT:-2003}
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
      docling:
        condition: service_started
      paddleocr_service:
        condition: service_started
    networks:
      - default
      - supabase-network
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_TURNSTILE_WORKER_URL: ${VITE_TURNSTILE_WORKER_URL:-}
    command: celery -A backend.celery_app.celery beat --loglevel=info
    env_file: .env
    environment:
      - DOCLING_SERVICE_URL=http://docling:28182
      - PADDLEOCR_SERVICE_URL=http://paddleocr_service:8080
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - supabase-network
    restart: unless-stopped

  docling:
    build:
      context: .
      dockerfile: backend/docling_service/Dockerfile
    env_file: .env
    ports:
      - "${DOCLING_SERVICE_PORT:-28182}:28182"
    volumes:
      - appdata:/data
      - docling_models:/app/models
    networks:
      - default
    restart: unless-stopped

  # [Flow: 모든 OCR 요청의 단일 진입점 — worker/beat가 /api/convert* 로 호출]
  # PADDLEOCR_BACKEND로 엔진을 고른다:
  #   local_v5 (기본) : PP-OCRv5 + PP-StructureV3 로컬 CPU 추론 (a1, GPU 불필요)
  #   aistudio        : PaddleOCR AI Studio 유료 API 프록시
  #   local_vl        : PaddleOCR-VL 1.6 + vLLM (GPU 필요 — b2 복구 후)
  # 이미지 자체가 세 백엔드를 모두 담고 있으므로, 롤백은 환경변수 한 줄이다.
  paddleocr_service:
    build:
      context: .
      # 롤백 경로: .env에 PADDLEOCR_DOCKERFILE=backend/paddleocr_service/Dockerfile 를 두면
      # 기존 경량 AI Studio 프록시 이미지로 되돌아간다 (PADDLEOCR_BACKEND=aistudio 와 함께 사용).
      dockerfile: ${PADDLEOCR_DOCKERFILE:-backend/paddleocr_service/Dockerfile.v5}
    env_file: .env
    environment:
      - PADDLEOCR_BACKEND=${PADDLEOCR_BACKEND:-local_v5}
      - PADDLEOCR_API_TOKEN=${PADDLEOCR_API_TOKEN:-}
      - PADDLEOCR_API_URL=${PADDLEOCR_API_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      # 로컬 추론 실패 시 AI Studio로 재시도 (토큰이 있을 때만 동작). 안정화 후 false 권장.
      - PADDLEOCR_LOCAL_FALLBACK_TO_AISTUDIO=${PADDLEOCR_LOCAL_FALLBACK_TO_AISTUDIO:-true}
      # PP-OCRv5 모델/성능 튜닝. POOL_SIZE × CPU_THREADS ≈ 물리 코어 수(a1: 40코어/80스레드)
      - PADDLEOCR_V5_REC_MODEL=${PADDLEOCR_V5_REC_MODEL:-korean_PP-OCRv5_mobile_rec}
      - PADDLEOCR_V5_DET_MODEL=${PADDLEOCR_V5_DET_MODEL:-PP-OCRv5_server_det}
      - PADDLEOCR_V5_POOL_SIZE=${PADDLEOCR_V5_POOL_SIZE:-4}
      - PADDLEOCR_V5_CPU_THREADS=${PADDLEOCR_V5_CPU_THREADS:-16}
      # oneDNN은 paddlepaddle 3.3.1에서 PP-StructureV3 추론 중 크래시한다 (a1 실측) — off 유지
      - PADDLEOCR_V5_ENABLE_MKLDNN=${PADDLEOCR_V5_ENABLE_MKLDNN:-false}
      # 표 셀/도장 인식기까지 한국어 모델로 교체 (본문만 바꾸는 kwarg로는 부족)
      - PADDLEOCR_V5_PATCH_ALL_RECOGNIZERS=${PADDLEOCR_V5_PATCH_ALL_RECOGNIZERS:-true}
      # 인식 배치 크기는 올리면 오히려 느려진다 (a1 실측: 1→113s, 8→130s) — 1 유지
      - PADDLEOCR_V5_REC_BATCH_SIZE=${PADDLEOCR_V5_REC_BATCH_SIZE:-1}
      # 레이아웃 검출 모델. 비워둘 것 — PP-DocLayout-S는 한국어 스캔 표에서 레이아웃을
      # 전혀 검출하지 못해 마크다운/표가 통째로 비었다 (a1 실측).
      - PADDLEOCR_V5_LAYOUT_MODEL=${PADDLEOCR_V5_LAYOUT_MODEL:-}
      - PADDLEOCR_V5_TABLE_RECOGNITION=${PADDLEOCR_V5_TABLE_RECOGNITION:-true}
      - PADDLEOCR_V5_SEAL_RECOGNITION=${PADDLEOCR_V5_SEAL_RECOGNITION:-true}
      # 로컬 백엔드는 외부 API의 10페이지/job 제한을 받지 않는다.
      - PADDLEOCR_LOCAL_BATCH_MAX_PAGES=${PADDLEOCR_LOCAL_BATCH_MAX_PAGES:-200}
      # 자동 파라미터 추천용 Vision LLM. 비워두면 서비스가 env_file(.env)의
      # DEFAULT_LLM_ENDPOINT/DEFAULT_LLM_MODEL로 폴백한다 (compose는 변수 기본값 중첩을 지원하지 않는다).
      - PADDLEOCR_RECOMMENDER_ENDPOINT=${PADDLEOCR_RECOMMENDER_ENDPOINT:-}
      - PADDLEOCR_RECOMMENDER_MODEL=${PADDLEOCR_RECOMMENDER_MODEL:-}
      - OMP_NUM_THREADS=${PADDLEOCR_V5_CPU_THREADS:-16}
    volumes:
      - appdata:/data
      # PP-OCRv5/PP-StructureV3 가중치 캐시 — 재시작 시 재다운로드 방지
      - paddleocr_v5_models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - default
    restart: unless-stopped

  # [Flow: FastAPI api 서비스가 /api/ai/* 요청을 이 컨테이너(3001)로 리버스 프록시한다]
  # Vercel AI SDK 5.x 기반 Node.js AI 백엔드. streamText + tools로 에이전트 도구 루프를 처리.
  ai-backend:
    build:
      context: .
      dockerfile: ai-backend/Dockerfile
    env_file: .env
    environment:
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://192.168.1.69:18080/v1}
      - LLM_MODEL=${LLM_MODEL:-cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # FastAPI에 도구 호출을 전달할 때 사용할 base URL (컨테이너 내부에서 api 서비스로)
      # 런타임에 도구 호출 시 api를 찾으므로 startup 의존성은 없음 (순환 의존 방지)
      - PROOF_API_URL=http://api:28181
      # browserless 원격 브라우저 서버 (a1 기존 구동 중, sandbox VM 공유)
      - BROWSERLESS_URL=${BROWSERLESS_URL:-http://192.168.1.50:20047}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-qwer1234}
      # [Flow: LLMLingua-2 프롬프트 압축 서비스 — 도구 결과가 임계값 초과 시 동적 압축]
      - LLMLINGUA_URL=http://llmlingua:8000
      - LLMLINGUA_RATE=${LLMLINGUA_RATE:-0.5}
    networks:
      - default
    restart: unless-stopped

  # [Flow: LLMLingua-2 프롬프트 압축 마이크로서비스 — 도구 결과 JSON 동적 압축]
  # ai-backend가 prepareStep에서 이전 스텝의 tool 결과가 4000자 초과 시 POST /compress 호출
  # 동적 rate: 4000~8000자→0.5(2x), 8000~20000자→0.3(3x), 20000자+→0.2(5x)
  llmlingua:
    build:
      context: .
      dockerfile: llmlingua-service/Dockerfile
    environment:
      - LLMLINGUA_MODEL=${LLMLINGUA_MODEL:-microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank}
      - LLMLINGUA_RATE=${LLMLINGUA_RATE:-0.5}
    ports:
      - "8001:8000"
    networks:
      - default
    restart: unless-stopped

  # [Flow: 문서(PPTX/DOCX/HWP/ODT)를 PDF로 변환하는 LibreOffice listener]
  # 백엔드는 XMLRPC 클라이언트로 접근, 파일은 바이너리 데이터로 전송.
  unoserver:
    build:
      context: .
      dockerfile: backend/unoserver/Dockerfile
    env_file: .env
    environment:
      - UNOSERVER_INTERFACE=0.0.0.0
      - UNOSERVER_PORT=2003
      - UNOSERVER_UNO_INTERFACE=127.0.0.1
      - UNOSERVER_UNO_PORT=2002
      - UNOSERVER_CONVERSION_TIMEOUT=120
    healthcheck:
      test: ["CMD", "unoping", "--host", "127.0.0.1", "--port", "2003", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - default
    restart: unless-stopped

volumes:
  appdata:
  docling_models:
  paddleocr_v5_models:

networks:
  supabase-network:
    external: true
    name: supabase-network
